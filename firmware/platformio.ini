; Educational robot firmware — ESP32-S3-DevKitC-1 N16R8 (16 MB QIO flash, 8 MB OPI PSRAM)
;
; Environments
;   diag    Minimal diagnostic firmware: chip/flash/PSRAM report, I2C scan, SH1106 test pattern.
;   robot   Full standalone robot firmware (OLED face, state machine, Wi-Fi, audio, gateway client).
;   native  Host unit tests for the portable logic (no hardware needed):  pio test -e native
;
; Versions are pinned so a build on your laptop matches the build verified in CI/dev.

[platformio]
default_envs = robot

[env]
lib_ldf_mode = deep+

[esp32s3_base]
platform = espressif32@6.13.0
; Project-local board definition (boards/esp32-s3-devkitc-1-n16r8.json): the stock
; "esp32-s3-devkitc-1" describes the N8 variant (8 MB flash, no PSRAM).
board = esp32-s3-devkitc-1-n16r8
framework = arduino
; --- N16R8 memory configuration (also in the board file; kept explicit here) ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; --- serial / upload ---
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Keep DTR/RTS released when the monitor opens: avoids resetting / holding the board in
; download mode on both the native USB port and the USB-UART port.
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DROBOT_FW_VERSION=\"0.6.0\"
    -Iinclude

[env:diag]
extends = esp32s3_base
build_src_filter = +<diag/>
lib_deps =
    olikraus/U8g2@2.36.18
lib_ignore = robot_logic, robot_ui, robot_hw

[env:robot]
extends = esp32s3_base
build_src_filter = +<app/>
lib_deps =
    olikraus/U8g2@2.36.18
    bblanchon/ArduinoJson@7.4.3

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -DROBOT_NATIVE=1
lib_deps =
    bblanchon/ArduinoJson@7.4.3
lib_ignore = robot_ui, robot_hw
